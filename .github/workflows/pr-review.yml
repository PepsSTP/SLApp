name: PR Acceptance Criteria Check

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  criteria-check:
    name: Check Acceptance Criteria
    runs-on: ubuntu-latest
    # Only run for agent-created branches
    if: startsWith(github.head_ref, 'agent/')
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Check acceptance criteria
        run: node scripts/check-pr.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_ACCESS_TOKEN: ${{ secrets.LINEAR_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
